spring.application.name=reviewPlus2.0

# ============ HTTPS 쿠키 (필수) ============
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

# UTF-8 Encoding
server.servlet.encoding.force=true
server.address=0.0.0.0

# Render가 주는 PORT 사용
server.port=${PORT:9090}

# ============ File Upload 경로 (Render) ============
# Render 컨테이너 내 저장. restart될 때 사라짐.
file.dir=/tmp/upload/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============ JPA & Hibernate ============

spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.database=oracle
spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.properties.hibernate.format_sql=true

tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.bearer-token=${TMDB_TOKEN}

# Remember-me
security.rememberme.key=${REMEMBER_ME_KEY}

spring.security.oauth2.client.registration.google.scope=profile,email,https://www.googleapis.com/auth/user.birthday.read

# Spring Session (필수)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# ============ ORACLE DB 설정 ============

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
