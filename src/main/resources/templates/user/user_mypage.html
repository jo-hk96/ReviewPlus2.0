<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" 
                  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유저정보</title>
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/user_mypage.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2210 0 100 100%22><text y=%22.90em%22 font-size=%2290%22>🎬</text></svg>">
</head>
<style>
	#Logout{
	background-color: #007bff;
	border-radius: 5px;
	width: 100px;
	text-align: center;
	transition: background-color 0.3s ease;
	}
	#Logout > a {
	color: white;
	text-decoration: none;
	}
	
	#Logout:hover {
	background-color: #0056b3;
	}

</style>


<body>
<button class="menu-btn" onclick="toggleMenu()">메뉴</button>
<div id="menu-list">
	
	<!-- 홈 바로가기 버튼 -->
	<form action="/" method="get" style="margin-bottom:10px;">
	  <button type="submit" class="home-btn">홈 바로가기</button>
	</form>
	
	  <!-- 내 정보 수정 -->
	  <form action="/UserEditForm" method="Get" style="margin-bottom:10px;">
	  	<button type="submit">내 정보 수정</button>
	  </form>
	   <!-- 탈퇴 버튼 -->
	  <form th:action="@{/UserDelete}" method="post">
	    <button type="submit" onclick="return confirm('정말 탈퇴 하시겠습니까?')"
	    	style="background-color: red; color: white; border: none; padding: 10px 20px; cursor: pointer;"
	    	    onmouseover="this.style.backgroundColor='red'"
	    	    onmouseout="this.style.backgroundColor='#d34c4c'">회원 탈퇴</button>
	  </form>
</div>
<script>
	function toggleMenu() {
	  const menu = document.getElementById("menu-list");
	  if(menu.style.display === "none" || menu.style.display === "") {
	    menu.style.display = "block";
	  } else {
	    menu.style.display = "none";
	  }
	}
</script>

	
	<div class="user-info-outer">
		<div class="user-info-box">
			<!-- 프로필이미지 -->
			
			<img
			    id = "userProfilePicture" th:src="@{'/images/profile/' + ${profileFileName}}" 
			    alt="프로필 사진" >
			<div id="resultMessage" style="text-align:center; color: green; margin-bottom:10px;"></div>
			<button id="changeProfileButton" onclick="callFlutterToPickImage()" class="btn btn-primary">
			    프로필 사진 변경 (Flutter 기능 호출)
			</button>
			<form id="profileUploadForm" action="/api/profile/upload/1" method="post" enctype="multipart/form-data">
			    <div>
			        <input type="file" id="profileImageInput" name="file" accept="image/*" required style = "display: none;">
			    </div>
			    <button type="submit" id="uploadButton" style = "margin: 0 auto;">프로필 저장</button>
			</form>
			<table>
			
				<tr>
					<td>이메일: <span sec:authentication="principal.username"></span></td>
				</tr>
				<tr>
					<td>이름: <span sec:authentication="principal.pname"></span></td>
				</tr>
				<tr>
					<td>닉네임: <span sec:authentication="principal.nickname"></span></td>
				</tr>
				<tr>
					<td>생년월일:<span sec:authentication="principal.birthdate"></span></td>
				</tr>
				<tr>
				</tr>

			</table>
				
	<!-- 사용자 좋아요 목록 MODAL -->
	<button id="showLikedMoviesBtn" onclick="openLikeModal()">
	    좋아요 목록 보기
	</button>
	<br>
	<div id="likeModal" class="modal" style="display:none;">
	
		<div class ="modal-content">
				<span class = "close-btn">닫기</span>
				<h3>
					<span sec:authentication="principal.nickname"></span>님의 좋아요 목록 
				</h3>
				
				<!-- 사용자 좋아요 목록보여주는 컨테이너 -->
				<div id="likedMoviesContainer">
				</div>		
				
				<div id="emptyMessage" style="display:none;">
					<p>아직 좋아요가 없습니다.</p>
				</div>
		</div>
	</div>
				
	    <!-- 사용자 리뷰 목록 MODAL -->
		<button id="showReviewMoviesBtn" onclick="openReviewModal()">
		    리뷰 목록 보기
		</button>
		<div id="ReviewModal" class="modal" style="display:none;">
		
			<div class ="modal-content-Review">
				<span class = "close-btn2">닫기</span>
				<h3><span sec:authentication="principal.nickname"></span>님의 리뷰 목록</h3>
				
				<!-- 사용자 좋아요 목록 컨테이너 -->
				<div id="ReviewMoviesContainer"></div>		
					<div id="emptyReviewMessage" style="display:none;">
						<p>아직 등록된 리뷰가 없습니다.</p>
					</div>
			</div>
		</div>
		<br>
		
		<span sec:authorize="hasRole('ROLE_ADMIN')">
	        <b><a href="/Admin/AdminHome">사이트관리</a></b>
	    </span>
		
		<br>
		<div class ="Logout" id = "Logout" sec:authorize="isAuthenticated()">
			<a href = "/logout"  onclick = "return confirm('로그아웃 하시겠습니까?')">로그아웃</a>
		</div>
		
		</div>
	</div>

<!------------------------------------------------------------------>
<script th:inline="javascript">
    const LOGGED_IN_USER_ID = [[${currentUserId}]];
    console.log("주입된 userId:", LOGGED_IN_USER_ID);
    if (LOGGED_IN_USER_ID) {
        loadProfileImage(LOGGED_IN_USER_ID); 
    }
</script>

<script>
	const profileImage = document.getElementById('userProfilePicture');
	const fileInput = document.getElementById('profileImageInput');

	profileImage.addEventListener('click', function(){
		fileInput.click();
	});
	
</script>

<script>
    // ⭐️ Flutter와 통신할 핵심 JavaScript 함수 ⭐️
    function callFlutterToPickImage() {
        console.log('JavaScript: Flutter 갤러리 열기 요청');
        
        // window.flutter_inappwebview.callHandler() 대신 
        // webview_flutter의 postMessage를 사용합니다.
        // 채널 이름은 'ToFlutter'로 가정
        if (window.ToFlutter && window.ToFlutter.postMessage) {
            window.ToFlutter.postMessage('PICK_IMAGE_REQUEST');
        } else {
            alert('Flutter 통신 채널을 찾을 수 없습니다.');
        }
    }

    // 서버에 업로드가 성공하면, 이 JS 함수를 Flutter가 다시 호출하여 이미지를 업데이트할 수 있음
    function updateProfileImage(newImageUrl) {
        document.getElementById('userProfilePicture').src = newImageUrl;
        document.getElementById('resultMessage').innerText = '사진 업데이트 완료!';
    }
</script>


<script src="js/upload.js"></script>
		
<!-- 푸터 -->
<div th:insert="index/index :: footer"></div>

<!-- 푸터 문의하기 -->
<script src="js/footer.js"></script>
	
<!-- 사용자 좋아요 목록.js-->
<script src = "js/user_LikeListBtn.js" ></script>

<!-- 리뷰 작성 목록.js -->
<script src = "js/user_ReviewListBtn.js"></script>

</body>
</html>
